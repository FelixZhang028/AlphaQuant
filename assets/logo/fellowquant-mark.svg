<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fq-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7EC8FF"/>
    </linearGradient>
    <linearGradient id="fq-fellow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7EC8FF" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- 伴行线（Fellow）：与主线同向、相随而行 -->
  <path d="M96 428 L192 348 L264 384"
        fill="none" stroke="url(#fq-fellow)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 主线（Quant）：上升折线，净值曲线意象 -->
  <path d="M72 372 L168 284 L248 324 L352 196"
        fill="none" stroke="url(#fq-line)" stroke-width="48"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 引导星：折线终点的四芒星，方向与指引 -->
  <path d="M400 84
           C408 132 428 156 476 164
           C428 172 408 196 400 244
           C392 196 372 172 324 164
           C372 156 392 132 400 84 Z"
        fill="url(#fq-line)"/>
</svg>
