<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FellowQuant · Quant Dolphin Logo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#F1F5F9; color:#0F172A; padding:40px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:.02em; }
  h1 span { color:#2563EB; }
  .sub { color:#64748B; font-size:13px; margin:6px 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; max-width:1180px; }
  .card { border-radius:18px; padding:26px; display:flex; flex-direction:column; align-items:center; gap:14px; box-shadow:0 1px 3px rgba(15,23,42,.08); }
  .card .label { font-size:12px; color:#64748B; }
  .light { background:#FFFFFF; }
  .dark  { background:#0B1220; } .dark .label { color:#94A3B8; }
  .brand { background:linear-gradient(135deg,#2563EB,#0EA5E9); } .brand .label { color:#DBEAFE; }
  .card img { display:block; }
  .sizes { display:flex; align-items:flex-end; gap:18px; }
  .sizes div { text-align:center; font-size:11px; color:#94A3B8; }
</style>
</head>
<body>
  <h1>FellowQuant <span>·</span> Quant Dolphin</h1>
  <p class="sub">群智海豚 — 群体协作 (Fellow) × 声呐信号探测 (Quant) × 流线敏锐 (市场)</p>

  <div class="grid">
    <div class="card light">
      <img src="fellowquant-dolphin.svg" width="180" height="180" alt="">
      <div class="label">主符号 · 彩色渐变（透明底）</div>
    </div>
    <div class="card light">
      <img src="fellowquant-dolphin-appicon.svg" width="180" height="180" alt="">
      <div class="label">App 图标 · 圆角方块</div>
    </div>
    <div class="card light">
      <img src="fellowquant-dolphin-mono.svg" width="180" height="180" alt="">
      <div class="label">单色 · 深墨（浅底用）</div>
    </div>
    <div class="card dark">
      <img src="fellowquant-dolphin-white.svg" width="180" height="180" alt="">
      <div class="label">反白 · 深底用</div>
    </div>
    <div class="card brand" style="grid-column:span 2;">
      <img src="fellowquant-dolphin-white.svg" width="120" height="120" alt="">
      <div class="label">品牌渐变底上的反白应用</div>
    </div>
    <div class="card light" style="grid-column:span 2; justify-content:center;">
      <div class="sizes">
        <div><img src="fellowquant-dolphin.svg" width="16" height="16" alt=""><br>16</div>
        <div><img src="fellowquant-dolphin.svg" width="24" height="24" alt=""><br>24</div>
        <div><img src="fellowquant-dolphin.svg" width="32" height="32" alt=""><br>32</div>
        <div><img src="fellowquant-dolphin.svg" width="48" height="48" alt=""><br>48</div>
        <div><img src="fellowquant-dolphin.svg" width="64" height="64" alt=""><br>64</div>
        <div><img src="fellowquant-dolphin-appicon.svg" width="64" height="64" alt=""><br>icon 64</div>
      </div>
      <div class="label">小尺寸可读性（favicon 场景）</div>
    </div>
  </div>
</body>
</html>
