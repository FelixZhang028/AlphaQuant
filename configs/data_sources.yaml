providers:
  ifind:
    enabled: true
    priority: 1
    username_env: IFIND_USERNAME
    password_env: IFIND_PASSWORD
    batch_size: 3
  tushare:
    enabled: false
    priority: 2
    token_env: TUSHARE_TOKEN
  akshare:
    enabled: true
    priority: 3

routing:
  security_master: [akshare]
  trade_calendar: [ifind, akshare]
  daily_bars: [ifind, akshare]
  adjustment_factors: [ifind]
  price_limits: []
  suspensions: [akshare]

quality:
  unknown_status_policy: allow_trade
  fail_on_missing_adjustment_factor: false
  allow_fallback_provider: true
