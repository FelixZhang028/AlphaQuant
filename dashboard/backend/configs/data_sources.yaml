providers:
  xtick:
    display_name: XTick
    enabled: true
    priority: 1
    token_env: XTICK_TOKEN
    base_url: http://api.xtick.top
  baostock:
    display_name: BaoStock
    enabled: true
    priority: 2
  ifind:
    display_name: iFinD
    enabled: false
    priority: 3
    username_env: IFIND_USERNAME
    password_env: IFIND_PASSWORD
    batch_size: 3
  tushare:
    display_name: Tushare
    enabled: false
    priority: 4
    token_env: TUSHARE_TOKEN
  akshare:
    display_name: AkShare
    enabled: true
    priority: 5
  pytdx:
    display_name: PyTDX
    enabled: true
    priority: 6
    timeout: 3
    retries: 1
    max_servers: 8
    max_pages: 20
    servers: []

routing:
  security_master: [akshare]
  trade_calendar: [baostock, akshare]
  daily_bars: [xtick, baostock, akshare, pytdx]
  adjustment_factors: [baostock]
  price_limits: []
  suspensions: [baostock, akshare]

quality:
  unknown_status_policy: reject_trade
  fail_on_missing_adjustment_factor: false
  allow_fallback_provider: true
