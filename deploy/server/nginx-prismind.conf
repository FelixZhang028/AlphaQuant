# 镜思 Prismind：Nginx 把请求转给本机 8000 端口的后端。
# 只在第一次准备服务器时由 deploy/server/setup.sh 安装到 /etc/nginx/sites-available/prismind；
# 之后 certbot --nginx 会在安装好的文件里加上 https 设置，所以部署新版本时不再覆盖它。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name getprismind.com www.getprismind.com _;
    server_tokens off;

    # 后端默认一次请求最多 5 MB（FELLOWQUANT_MAX_BODY_MB）。
    client_max_body_size 6m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖访问者自己带来的同名请求头，后端只信这里给的地址。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 回测、因子评估等计算最长 600 秒。
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
